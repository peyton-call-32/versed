# XcodeGen recipe for the Xcode project.
# After changing this file, run `xcodegen` to rebuild Versed.xcodeproj.
name: Versed

options:
  bundleIdPrefix: com.peytoncall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Peyton's Apple Developer team. Xcode makes and renews the signing certificates itself.
    DEVELOPMENT_TEAM: 49K5VLD6N9
    CODE_SIGN_STYLE: Automatic

targets:
  Versed:
    type: application
    platform: iOS
    sources:
      - Versed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peytoncall.versed
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Lists the bundled fonts. Everything else in the Info.plist is generated from the keys below.
        INFOPLIST_FILE: Versed/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Versed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Versed uses no encryption beyond what iOS provides, so App Store Connect won't ask on each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VersedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VersedTests
    dependencies:
      - target: Versed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  VersedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VersedUITests
    dependencies:
      - target: Versed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Versed

schemes:
  Versed:
    build:
      targets:
        Versed: all
    test:
      targets:
        - VersedTests
        - VersedUITests
